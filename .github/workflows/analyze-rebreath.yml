name: Analyze Rebreath Scripts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/analyze-rebreath.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: windows-latest
    steps:
      - name: Download and verify Elden Rim Base archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "elden-rim-base.7z"
          Invoke-WebRequest -Uri "https://github.com/Dabao6666/cunchu/releases/download/v1.0.0/0-Elden.Rim-Base.3.7.5.7z" -OutFile $archive
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "cf701c6c559f24ef2eba4cbb765de588d92b6cae908e2d37aa67a351e090b1ba") {
            throw "Archive SHA256 mismatch: $hash"
          }

      - name: Extract only PEX files from the target archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "elden-rim-base.7z"
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) { throw "7-Zip executable not found on runner" }
          $source = Join-Path $env:RUNNER_TEMP "package-pex"
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          & $sevenZip e $archive -r "-o$source" -y "*.pex"
          if ($LASTEXITCODE -ne 0) { throw "7-Zip PEX extraction failed" }
          $pexFiles = @(Get-ChildItem -Path $source -Filter "*.pex" -File -Recurse)
          "Extracted PEX count: $($pexFiles.Count)"
          $pexFiles | Select-Object FullName, Length | Format-Table -AutoSize
          if ($pexFiles.Count -eq 0) {
            & $sevenZip l $archive -slt | Select-String -Pattern "\.pex($|\s)" | ForEach-Object { Write-Host $_.Line }
            throw "No PEX files found in archive"
          }

      - name: Download Champollion decompiler
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "champollion.zip"
          Invoke-WebRequest -Uri "https://github.com/Orvid/Champollion/releases/download/v1.3.2/Champollion.v1.3.2.zip" -OutFile $zip
          $toolDir = Join-Path $env:RUNNER_TEMP "champollion"
          Expand-Archive -Path $zip -DestinationPath $toolDir -Force
          $tool = Get-ChildItem $toolDir -Filter "Champollion.exe" -Recurse | Select-Object -First 1
          if ($null -eq $tool) { throw "Champollion.exe was not found in release archive" }
          "CHAMPOLLION_PATH=$($tool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Decompile only PEX files from the target archive
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "package-pex"
          $output = Join-Path $env:RUNNER_TEMP "decompiled"
          $assembly = Join-Path $env:RUNNER_TEMP "assembly"
          New-Item -ItemType Directory -Force -Path $output, $assembly | Out-Null
          $pexFiles = @(Get-ChildItem -Path $source -Filter "*.pex" -File -Recurse)
          foreach ($pex in $pexFiles) {
            & $env:CHAMPOLLION_PATH $pex.FullName -p $output -a $assembly -c
            if ($LASTEXITCODE -ne 0) { throw "Champollion failed on $($pex.Name) with exit code $LASTEXITCODE" }
          }
          $pscFiles = @(Get-ChildItem -Path $output -Filter "*.psc" -File -Recurse)
          if ($pscFiles.Count -eq 0) { throw "Champollion produced no PSC files" }
          "Decompiled $($pscFiles.Count) package scripts."
          $pscFiles | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload decompiled package scripts
        uses: actions/upload-artifact@v4
        with:
          name: elden-rim-base-rebreath-analysis
          path: |
            ${{ runner.temp }}\decompiled\**
            ${{ runner.temp }}\assembly\**
          retention-days: 1
          compression-level: 6
