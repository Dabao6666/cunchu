name: Decompile selected SCSI 10.731 Papyrus scripts
on:
  push:
    paths:
      - 'analysis/scsi731-selected.zip.b64'
      - '.github/workflows/decompile-scsitarget.yml'
jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Champollion
        run: |
          curl -L --fail -o champollion.zip https://github.com/0xra0/Champollion/releases/download/v1.3.2/ChampollionGUI-v1.3.2-linux-x86_64.zip
          unzip -q champollion.zip -d champollion
          chmod +x champollion/Champollion
      - name: Decode selected PEX files
        run: |
          base64 -d analysis/scsi731-selected.zip.b64 > selected.zip
          mkdir -p input psc asm
          unzip -q selected.zip -d input
          ./champollion/Champollion input -p psc -a asm -r -t -e
          zip -qr scsi731-selected-decompiled.zip psc asm
      - uses: actions/upload-artifact@v4
        with:
          name: scsi731-selected-decompiled
          path: scsi731-selected-decompiled.zip
