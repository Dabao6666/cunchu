name: Decompile SCSI 10.731 actor scripts
on:
  push:
    paths:
      - 'analysis/scsi731-actor.zip.b64'
      - '.github/workflows/decompile-scsitarget.yml'
jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Champollion CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-program-options-dev libfmt-dev
          git clone --depth 1 https://github.com/0xra0/Champollion.git champollion-src
          cmake -S champollion-src -B champollion-src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build champollion-src/build -j2
      - name: Decode and decompile
        run: |
          base64 -d analysis/scsi731-actor.zip.b64 > selected.zip
          mkdir -p input psc asm
          unzip -q selected.zip -d input
          find input -type f -name '*.pex' -print0 | while IFS= read -r -d '' f; do
            ./champollion-src/build/Champollion/Champollion "$f" -p psc -a asm -e
          done
          zip -qr scsi731-actor-decompiled.zip psc asm
      - uses: actions/upload-artifact@v4
        with:
          name: scsi731-actor-decompiled
          path: scsi731-actor-decompiled.zip
