name: Decompile selected SCSI 10.731 Papyrus scripts
on:
  push:
    paths:
      - 'analysis/scsi731-alpha.pex.b64'
      - '.github/workflows/decompile-scsitarget.yml'
jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Champollion
        run: |
          curl -L --fail -o champollion.zip https://github.com/0xra0/Champollion/releases/download/v1.3.2/ChampollionGUI-v1.3.2-linux-x86_64.zip
          unzip -q champollion.zip -d champollion
          chmod +x champollion/Champollion
      - name: Decode and decompile
        run: |
          base64 -d analysis/scsi731-alpha.pex.b64 > SCSI_AddAlphaFX_ShadowWalk.pex
          mkdir -p psc asm
          ./champollion/Champollion SCSI_AddAlphaFX_ShadowWalk.pex -p psc -a asm -e
          zip -qr scsi731-alpha-decompiled.zip psc asm
      - uses: actions/upload-artifact@v4
        with:
          name: scsi731-alpha-decompiled
          path: scsi731-alpha-decompiled.zip
